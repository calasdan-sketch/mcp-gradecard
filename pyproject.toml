[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gradecard"
version = "0.5.0"
description = "Offline security audit of the MCP servers your AI agents use: graded A to F, with a report you can hand over."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Calas Automations Inc."}]
maintainers = [{name = "Calas Automations Inc."}]
keywords = ["mcp", "security", "audit", "prompt-injection", "supply-chain", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/mcp-gradecard"
Source = "https://github.com/calasdan-sketch/mcp-gradecard"
Issues = "https://github.com/calasdan-sketch/mcp-gradecard/issues"
Changelog = "https://github.com/calasdan-sketch/mcp-gradecard/blob/main/CHANGELOG.md"

[project.scripts]
mcp-gradecard = "mcp_gradecard.cli:main"
# Old command name, kept so existing users and scripts keep working.
mcp-audit = "mcp_gradecard.cli:main"

[tool.setuptools]
packages = ["mcp_gradecard", "mcp_audit"]

# Without this the wheel has no advisory feed and every known-vulnerable
# package reads as clean.
[tool.setuptools.package-data]
mcp_gradecard = ["advisories.json"]

[tool.ruff]
extend-exclude = [".venv-sop"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# short names and one-line lambdas in test helpers are fine
"tests/*" = ["E731", "E741"]
